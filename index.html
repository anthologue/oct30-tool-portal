<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robotics Tool Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="index.html">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,19 10,9 18,12"/><line x1="18" y1="12" x2="18" y2="18"/></svg></span>
      Robotics Tool Portal
    </a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Switch to dark theme</button>
  </header>

  <main>
    <h1>Try small <span class="highlight">robotics</span> tools</h1>
    <p class="intro">Pick a tool below to try it out in your browser. No sign-up and nothing to install.</p>

    <section class="tool-grid" aria-label="Tools">
      <a class="tool-card" href="tools/robot-arm-picker.html">
        <span class="tool-card-art" aria-hidden="true">
          <svg viewBox="0 0 200 90" width="220" height="99" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line class="art-ink" x1="0" y1="86" x2="200" y2="86" stroke-width="3"/>
            <rect class="art-fill" x="20" y="68" width="40" height="18" rx="4"/>
            <polyline class="art-ink" points="40,68 92,26 150,40" stroke-width="8"/>
            <line class="art-ink" x1="150" y1="40" x2="150" y2="54" stroke-width="6"/>
            <polyline class="art-ink" points="141,72 141,56 159,56 159,72" stroke-width="5"/>
            <rect class="art-block" x="144" y="62" width="12" height="12" rx="2"/>
            <circle class="art-joint" cx="40" cy="68" r="7" stroke-width="3"/>
            <circle class="art-joint" cx="92" cy="26" r="7" stroke-width="3"/>
            <circle class="art-joint" cx="150" cy="40" r="7" stroke-width="3"/>
          </svg>
        </span>
        <h2>Robot Arm Picker</h2>
        <p>Move a robot arm with sliders, pick up a block, and drop it into a bin.</p>
        <span class="tool-card-cta">Open tool →</span>
      </a>
    </section>
  </main>
</body>
</html>
